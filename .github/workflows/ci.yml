name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: vault-sync-plugin
          path: |
            main.js
            manifest.json
            versions.json
          if-no-files-found: error
